[package]
name = "pali-analysis"
version = "0.1.0"
edition = "2024"
description = "Pali tokenizer and stemmers for Tantivy, with a stem table built from the Digital Pali Dictionary"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
serde_json = "1.0.151"
tantivy = "0.26.1"
csv = "1.4.0"

[lints.rust]
warnings = "deny"

[lints.clippy]
pedantic = "deny"
